kind = "mobile"
previewPath = "/"
title = "KidVenture"
description = "A playful mobile coach for children ages 8–10 that turns screen time into short daily missions across learning, creativity, and kindness."
version = "1.0.0"
id = "artifacts/kidventure-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26179

[services.development]
run = "pnpm --filter @workspace/kidventure-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kidventure-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kidventure-mobile", "run", "serve" ]

[services.env]
PORT = "26179"
BASE_PATH = "/"
